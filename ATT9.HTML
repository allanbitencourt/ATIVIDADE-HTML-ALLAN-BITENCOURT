<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
    <h2>Formulário</h2>
    
    <form>
        <!-- Dados pessoais -->
        <fieldset>
            <legend>Dados pessoais</legend>
            <label>Nome: <input type="text" size="30"></label><br><br>
            <label>Endereço: <input type="text" size="30"></label><br><br>
            <label>Cidade: <input type="text" size="25"></label><br><br>
            <label>Estado: 
                <select>
                    <option selected>São Paulo</option>
                    <!-- Outros estados aqui -->
                </select>
            </label>
        </fieldset>
        
        <br>

        <!-- Dados profissionais -->
        <fieldset>
            <legend>Dados profissionais</legend>
            
            <p>Natureza do Cargo</p>
            <label><input type="radio" name="cargo" checked> Gerência</label>
            <label><input type="radio" name="cargo"> Financeiro</label>
            <label><input type="radio" name="cargo"> Recepção</label>
            <label><input type="radio" name="cargo"> Administrativo</label>
            <label><input type="radio" name="cargo"> Jurídico</label>
            
            <p>Área de interesse</p>
            <label><input type="checkbox"> Computação</label>
            <label><input type="checkbox"> Biologia</label>
            <label><input type="checkbox"> Meio Ambiente</label>
            <label><input type="checkbox"> Engenharia</label>
            <label><input type="checkbox"> História</label>
            
            <br><br>
            <textarea rows="5" cols="50"></textarea><br>
            
            <label>Mini-currículo:</label><br>
        </fieldset>
        
        <br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
